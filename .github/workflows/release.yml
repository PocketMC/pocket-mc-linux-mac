name: Release Pipeline

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Continuous Integration"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  release-build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            archive_ext: tar.gz
          - os: ubuntu-latest
            rid: linux-arm64
            archive_ext: tar.gz
          - os: macos-latest
            rid: osx-x64
            archive_ext: zip
          - os: macos-latest
            rid: osx-arm64
            archive_ext: zip
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_VERSION: "8.0.x"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - name: Parse Root Configuration
        id: config
        shell: bash
        run: |
          raw_version=$(grep '^version:' pocketmc.yml | sed -E 's/^[^:]*:[[:space:]]*//; s/[[:space:]]*#.*$//' | tr -d "\"'" | xargs)
          version=$(echo "${raw_version}" | sed 's/^v//')
          channel=$(grep '^channel:' pocketmc.yml | sed -E 's/^[^:]*:[[:space:]]*//; s/[[:space:]]*#.*$//' | tr -d "\"'" | xargs)
          echo "version=${version:-1.0.0}" >> $GITHUB_OUTPUT
          echo "channel=${channel:-none}" >> $GITHUB_OUTPUT

      - name: Ensure Release Channel & Check Version Tag
        id: check_channel
        shell: bash
        run: |
          if [ "${{ steps.config.outputs.channel }}" != "release" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Channel is not release. Exiting gracefully..."
            exit 0
          fi

          version="${{ steps.config.outputs.version }}"
          tag_name="v${version}"

          git fetch --tags origin || true
          if git rev-parse "refs/tags/${tag_name}" >/dev/null 2>&1 || git ls-remote --tags origin "refs/tags/${tag_name}" | grep -q "${tag_name}"; then
            echo "Release tag ${tag_name} already exists on remote. Skipping release build..."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "New release version ${tag_name} detected. Proceeding with release..."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.check_channel.outputs.skip == 'false'
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        if: steps.check_channel.outputs.skip == 'false'
        run: dotnet restore PocketMC.App/PocketMC.App.csproj -r ${{ matrix.rid }} -p:PublishReadyToRun=true

      - name: Publish Standalone Binary
        if: steps.check_channel.outputs.skip == 'false'
        run: |
          dotnet publish PocketMC.App/PocketMC.App.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishReadyToRun=true \
            --no-restore \
            -p:Version=${{ steps.config.outputs.version }} \
            -o publish

      - name: Package Release Archive (tar.gz)
        if: steps.check_channel.outputs.skip == 'false' && matrix.archive_ext == 'tar.gz'
        run: |
          tar -czf PocketMC-${{ matrix.rid }}.tar.gz -C publish .

      - name: Package Linux Debian Package (.deb)
        if: steps.check_channel.outputs.skip == 'false' && matrix.os == 'ubuntu-latest'
        run: |
          chmod +x scripts/build-deb.sh
          ./scripts/build-deb.sh ${{ matrix.rid }} ${{ steps.config.outputs.version }} publish

      - name: Package Release Archive (zip)
        if: steps.check_channel.outputs.skip == 'false' && matrix.archive_ext == 'zip'
        run: |
          cd publish
          zip -r ../PocketMC-${{ matrix.rid }}.zip .

      - name: Package macOS Disk Image (DMG)
        if: steps.check_channel.outputs.skip == 'false' && matrix.os == 'macos-latest'
        run: |
          chmod +x scripts/build-dmg.sh
          ./scripts/build-dmg.sh ${{ matrix.rid }} ${{ steps.config.outputs.version }} publish

      - name: Upload Build Artifacts
        if: steps.check_channel.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: PocketMC-${{ matrix.rid }}-${{ steps.config.outputs.version }}
          path: |
            PocketMC-${{ matrix.rid }}.${{ matrix.archive_ext }}
            PocketMC-*.dmg
            pocketmc_*.deb

  create-release:
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - name: Parse Version
        id: config
        shell: bash
        run: |
          raw_version=$(grep '^version:' pocketmc.yml | sed -E 's/^[^:]*:[[:space:]]*//; s/[[:space:]]*#.*$//' | tr -d "\"'" | xargs)
          version=$(echo "${raw_version}" | sed 's/^v//')
          channel=$(grep '^channel:' pocketmc.yml | sed -E 's/^[^:]*:[[:space:]]*//; s/[[:space:]]*#.*$//' | tr -d "\"'" | xargs)
          echo "version=${version:-1.0.0}" >> $GITHUB_OUTPUT
          echo "channel=${channel:-none}" >> $GITHUB_OUTPUT

      - name: Ensure Release Channel & Check Version Tag
        id: check_channel
        shell: bash
        run: |
          if [ "${{ steps.config.outputs.channel }}" != "release" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          version="${{ steps.config.outputs.version }}"
          tag_name="v${version}"

          git fetch --tags origin || true
          if git rev-parse "refs/tags/${tag_name}" >/dev/null 2>&1 || git ls-remote --tags origin "refs/tags/${tag_name}" | grep -q "${tag_name}"; then
            echo "Release tag ${tag_name} already exists on remote. Skipping release creation..."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Download all release artifacts
        if: steps.check_channel.outputs.skip == 'false'
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate Release Notes
        if: steps.check_channel.outputs.skip == 'false'
        shell: bash
        run: |
          version="${{ steps.config.outputs.version }}"
          {
            echo "## PocketMC v${version}: Production Release (Linux & macOS)"
            echo ""
            if [ -f "PocketMC.App/Assets/WhatsNew.txt" ]; then
              tr -d '\r' < PocketMC.App/Assets/WhatsNew.txt | awk '
                /^VERSION=/ { next }
                /^\[.*\]$/ {
                  section = substr($0, 2, length($0) - 2)
                  print "### " section
                  next
                }
                NF > 0 { print "- " $0 }
                NF == 0 { print "" }
              '
              echo ""
            fi
            echo "### Download Packages"
            echo ""
            echo "| Platform | Architecture | Formats |"
            echo "| :--- | :--- | :--- |"
            echo "| **Linux** | x64 (AMD64) | [PocketMC-linux-x64.tar.gz](https://github.com/PocketMC/pocket-mc-linux-mac/releases/download/v${version}/PocketMC-linux-x64.tar.gz), [pocketmc_${version}_amd64.deb](https://github.com/PocketMC/pocket-mc-linux-mac/releases/download/v${version}/pocketmc_${version}_amd64.deb) |"
            echo "| **Linux** | arm64 (AArch64) | [PocketMC-linux-arm64.tar.gz](https://github.com/PocketMC/pocket-mc-linux-mac/releases/download/v${version}/PocketMC-linux-arm64.tar.gz), [pocketmc_${version}_arm64.deb](https://github.com/PocketMC/pocket-mc-linux-mac/releases/download/v${version}/pocketmc_${version}_arm64.deb) |"
            echo "| **macOS** | Apple Silicon (M1/M2/M3/M4) | [PocketMC-osx-arm64.dmg](https://github.com/PocketMC/pocket-mc-linux-mac/releases/download/v${version}/PocketMC-osx-arm64.dmg), [PocketMC-osx-arm64.zip](https://github.com/PocketMC/pocket-mc-linux-mac/releases/download/v${version}/PocketMC-osx-arm64.zip) |"
            echo "| **macOS** | Intel (x64) | [PocketMC-osx-x64.dmg](https://github.com/PocketMC/pocket-mc-linux-mac/releases/download/v${version}/PocketMC-osx-x64.dmg), [PocketMC-osx-x64.zip](https://github.com/PocketMC/pocket-mc-linux-mac/releases/download/v${version}/PocketMC-osx-x64.zip) |"
          } > release_notes.md

      - name: Create GitHub Release
        if: steps.check_channel.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.config.outputs.version }}
          name: PocketMC v${{ steps.config.outputs.version }}
          body_path: release_notes.md
          files: |
            artifacts/PocketMC-linux-x64.tar.gz
            artifacts/PocketMC-linux-arm64.tar.gz
            artifacts/pocketmc_*.deb
            artifacts/PocketMC-osx-x64.zip
            artifacts/PocketMC-osx-arm64.zip
            artifacts/PocketMC-osx-x64.dmg
            artifacts/PocketMC-osx-arm64.dmg
          draft: false
          prerelease: ${{ contains(steps.config.outputs.version, 'beta') || contains(steps.config.outputs.version, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
